<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-labelledby="title desc">
<title id="title">Arianna Mora | Backend, Networks and DevOps</title>
<desc id="desc">Premium animated developer profile banner for Arianna Mora, ed on backend development, computer networks and DevOps.</desc>
<defs>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#10B981"/>
<animate attributeName="x1" values="0%;30%;-10%;0%" dur="10s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;70%;110%;100%" dur="10s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="ascii" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#10B981"/>
<animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="g1"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".14"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="rgba(148,163,184,.035)" stroke-width="1"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="rgba(0,0,0,.50)" flood-opacity=".55"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1180" height="610" rx="28"/></clipPath>
<style>
.mono{font-family:"SFMono-Regular","Cascadia Code","Roboto Mono","Fira Code",Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
.text{fill:#F8FAFC}.muted{fill:#94A3B8}
.role{font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",Consolas,monospace;fill:#22D3EE;font-size:16px;font-weight:700;letter-spacing:1px}
.fade{opacity:0;animation:fade .55s ease forwards}
.f1{animation-delay:1.7s}.f2{animation-delay:1.95s}.f3{animation-delay:2.2s}.f4{animation-delay:2.45s}.f5{animation-delay:2.7s}
.skill{opacity:0;animation:skill .5s ease forwards}
.s1{animation-delay:3.35s}.s2{animation-delay:3.48s}.s3{animation-delay:3.61s}.s4{animation-delay:3.74s}
.s5{animation-delay:3.87s}.s6{animation-delay:4s}.s7{animation-delay:4.13s}.s8{animation-delay:4.26s}
.float{animation:float 5s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}
.scan{animation:scan 4s linear infinite}.shimmer{animation:shimmer 3.2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes skill{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes scan{from{transform:translateY(-235px);opacity:0}18%{opacity:.18}78%{opacity:.18}to{transform:translateY(235px);opacity:0}}
@keyframes shimmer{0%,100%{opacity:.18}50%{opacity:.65}}
</style>
</defs>

<g clip-path="url(#frame)">
<rect width="1180" height="610" fill="#030712"/><rect width="1180" height="610" fill="url(#grid)"/>
<circle cx="100" cy="90" r="240" fill="url(#g1)"/><circle cx="1050" cy="520" r="270" fill="url(#g2)"/>
<rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="rgba(255,255,255,.10)"/>
